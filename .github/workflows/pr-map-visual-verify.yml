name: PR map and parcel visual verification

on:
  pull_request:
    branches: [main]
    types: [synchronize, reopened]

permissions:
  contents: read

jobs:
  verify:
    if: ${{ github.event.pull_request.number == 83 }}
    name: Test the PR preview and capture selected parcel layouts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out pull request
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install application dependencies
        run: npm install --no-audit --no-fund
      - name: Install Playwright
        run: npm install --no-save --no-audit --no-fund playwright
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify Bugesera parcel API
        env:
          APP_BASE_URL: https://rwanda-land-intelligence-git-fix-parcel-16361c-onielqs-projects.vercel.app
        run: node scripts/smoke-test-parcel-api.mjs
      - name: Verify village geometry and selected parcel responsive layouts
        env:
          APP_BASE_URL: https://rwanda-land-intelligence-git-fix-parcel-16361c-onielqs-projects.vercel.app
        run: node scripts/e2e-map-parcels.mjs
      - name: Upload responsive screenshots and map diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-83-selected-parcel-visual-review
          path: artifacts/*.png
          if-no-files-found: warn
          retention-days: 7
