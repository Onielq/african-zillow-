name: Cloudflare Workers

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  NEXT_PUBLIC_MAP_STYLE_URL: ${{ vars.NEXT_PUBLIC_MAP_STYLE_URL || 'https://tiles.openfreemap.org/styles/liberty' }}

jobs:
  build-and-deploy:
    name: Check and build Cloudflare Worker
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Check vinext compatibility
        run: npm run check:vinext

      - name: Build Worker
        run: npm run build:vinext

      - name: Check Cloudflare credentials
        id: cloudflare
        if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [[ -n "$CLOUDFLARE_API_TOKEN" && -n "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Worker build passed. Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID to repository Actions secrets to enable automatic deployment."
          fi

      - name: Verify token can read Workers in the selected account
        if: ${{ steps.cloudflare.outputs.configured == 'true' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error --output /tmp/cloudflare-preflight.json --write-out '%{http_code}' \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts")"
          if [[ "$status" != "200" ]]; then
            echo "::error::Cloudflare token cannot list Workers in CLOUDFLARE_ACCOUNT_ID (HTTP $status). The token must be scoped to this account and include Workers Scripts:Read and Workers Scripts:Edit."
            cat /tmp/cloudflare-preflight.json
            exit 1
          fi
          echo "Cloudflare token can access the selected account's Workers Scripts endpoint."

      - name: Verify token can upload a Worker
        if: ${{ steps.cloudflare.outputs.configured == 'true' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          probe_name="rli-permission-probe-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          printf '%s' '{"main_module":"index.js","compatibility_date":"2026-10-26","compatibility_flags":["nodejs_compat"],"bindings":[]}' > /tmp/rli-worker-metadata.json
          cat > /tmp/rli-worker-probe.js <<'EOF'
          export default {
            fetch() {
              return new Response("temporary deployment permission check");
            }
          };
          EOF

          status="$(curl --silent --show-error --output /tmp/rli-worker-upload.json --write-out '%{http_code}' \
            --request PUT \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            --form 'metadata=@/tmp/rli-worker-metadata.json;type=application/json' \
            --form 'index.js=@/tmp/rli-worker-probe.js;type=application/javascript+module' \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$probe_name")"

          if ! jq -e '.success == true' /tmp/rli-worker-upload.json >/dev/null 2>&1; then
            echo "::error::Cloudflare token can read Workers but cannot upload a temporary Worker. Update CLOUDFLARE_API_TOKEN with account-scoped Workers Scripts:Edit. API response (no credentials):"
            jq '{success, errors}' /tmp/rli-worker-upload.json
            exit 1
          fi

          delete_status="$(curl --silent --show-error --output /tmp/rli-worker-delete.json --write-out '%{http_code}' \
            --request DELETE \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$probe_name")"
          if ! jq -e '.success == true' /tmp/rli-worker-delete.json >/dev/null 2>&1; then
            echo "::warning::The temporary permission-check Worker was uploaded but could not be deleted (HTTP $delete_status). Remove $probe_name in the Cloudflare dashboard."
          else
            echo "Cloudflare Worker upload permission confirmed; temporary probe removed."
          fi

      - name: Deploy to Cloudflare Workers
        if: ${{ steps.cloudflare.outputs.configured == 'true' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEXT_PUBLIC_MAP_STYLE_URL: ${{ vars.NEXT_PUBLIC_MAP_STYLE_URL || 'https://tiles.openfreemap.org/styles/liberty' }}
        run: npm run deploy:vinext

      - name: Explain manual deployment
        if: ${{ github.event_name == 'workflow_dispatch' && steps.cloudflare.outputs.configured != 'true' }}
        run: echo "Build completed, but deployment was skipped because Cloudflare Actions secrets are missing. See docs/FREE_FIRST_STACK.md."
