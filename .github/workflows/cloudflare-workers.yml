name: Cloudflare Workers

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-workers-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_PUBLIC_MAP_STYLE_URL: ${{ vars.NEXT_PUBLIC_MAP_STYLE_URL || 'https://tiles.openfreemap.org/styles/liberty' }}
  NEXT_PUBLIC_ESRI_API_KEY: ${{ secrets.NEXT_PUBLIC_ESRI_API_KEY }}

jobs:
  build-and-deploy:
    name: Check and build Cloudflare Worker
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Check vinext compatibility
        run: npm run check:vinext

      - name: Build Worker
        run: npm run build:vinext

      - name: Check Cloudflare credentials
        id: cloudflare
        if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [[ -n "$CLOUDFLARE_API_TOKEN" && -n "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Worker build passed. Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID to repository Actions secrets to enable automatic deployment."
          fi

      - name: Verify token can read Workers in the selected account
        if: ${{ steps.cloudflare.outputs.configured == 'true' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error --output /tmp/cloudflare-preflight.json --write-out '%{http_code}' --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts")"
          if [[ "$status" != "200" ]]; then
            echo "::error::Cloudflare token cannot list Workers in CLOUDFLARE_ACCOUNT_ID (HTTP $status). Check that the token has Workers Scripts:Read and is scoped to this account."
            cat /tmp/cloudflare-preflight.json
            exit 1
          fi
          echo "Cloudflare token can access the selected account's Workers Scripts endpoint."

      # Do not test deployment by creating a temporary Worker here. The Cloudflare
      # Workers Scripts:Edit role can update/deploy existing Workers, but cannot
      # create or delete Workers. Deploy directly to the existing configured Worker.

      - name: Deploy to Cloudflare Workers
        if: ${{ steps.cloudflare.outputs.configured == 'true' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEXT_PUBLIC_MAP_STYLE_URL: ${{ vars.NEXT_PUBLIC_MAP_STYLE_URL || 'https://tiles.openfreemap.org/styles/liberty' }}
          DEBUG: "1"
          CF_SEND_TELEMETRY: "false"
        run: npm run deploy:vinext

      - name: Explain manual deployment
        if: ${{ github.event_name == 'workflow_dispatch' && steps.cloudflare.outputs.configured != 'true' }}
        run: echo "Build completed, but deployment was skipped because Cloudflare Actions secrets are missing. See docs/FREE_FIRST_STACK.md."
