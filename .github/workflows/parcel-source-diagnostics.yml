name: Parcel source diagnostics

on:
  push:
    branches: [main]
    paths:
      - "scripts/diagnose-parcel-sources.mjs"
      - "scripts/smoke-test-parcel-api.mjs"
      - "scripts/smoke-test-admin-path-search.mjs"
      - "src/app/api/geography/areas/search/route.ts"
      - "src/components/map/MapExperience.tsx"
      - "src/app/api/geography/areas/route.ts"
      - "src/components/map/MapView.tsx"
      - ".github/workflows/parcel-source-diagnostics.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-public-gis:
    name: Inspect parcel service metadata and production API
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build production app
        run: npm run build
      - name: Smoke-test production parcel API
        env:
          APP_BASE_URL: http://127.0.0.1:3000
        run: |
          npm run start -- --hostname 127.0.0.1 > /tmp/parcel-app.log 2>&1 &
          sleep 4
          node scripts/smoke-test-admin-path-search.mjs || { tail -n 160 /tmp/parcel-app.log; exit 1; }
          node scripts/smoke-test-parcel-api.mjs
      # Run the public GIS probes even if the production smoke test fails;
      # otherwise the first HTTP 502 masks whether the upstream parcel services
      # themselves are slow, unavailable, or returning a different schema.
      - name: Probe public parcel endpoints (read-only)
        if: always()
        run: node scripts/diagnose-parcel-sources.mjs
