name: Parcel source diagnostics

on:
  workflow_run:
    workflows: ["Cloudflare Workers"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-public-gis:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.conclusion == 'success') }}
    name: Verify deployed parcel APIs and public GIS sources
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out the exact deployed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install application dependencies
        run: npm install --no-audit --no-fund

      - name: Smoke-test deployed administrative path search
        env:
          APP_BASE_URL: https://rwanda-land-intelligence.taiseel.workers.dev
        run: node scripts/smoke-test-admin-path-search.mjs

      - name: Smoke-test deployed parcel API
        env:
          APP_BASE_URL: https://rwanda-land-intelligence.taiseel.workers.dev
        run: node scripts/smoke-test-parcel-api.mjs

      - name: Check sample Kigali UPI across published parcel layers (read-only)
        if: always()
        run: node scripts/diagnose-kigali-sample-upi.mjs

      - name: Probe public parcel endpoints (read-only)
        if: always()
        run: node scripts/diagnose-parcel-sources.mjs
