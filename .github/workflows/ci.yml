name: Project foundation checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Lint, types, tests, and production build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npm run typecheck
      - name: Baseline tests
        run: npm test
      - name: Production build
        env:
          ESRI_API_KEY: ${{ secrets.ESRI_API_KEY || secrets.NEXT_PUBLIC_ESRI_API_KEY }}
          NEXT_PUBLIC_ESRI_API_KEY: ${{ secrets.NEXT_PUBLIC_ESRI_API_KEY || secrets.ESRI_API_KEY }}
        run: npm run build
      - name: Docker image build
        env:
          NEXT_PUBLIC_MAP_STYLE_URL: ${{ vars.NEXT_PUBLIC_MAP_STYLE_URL || 'https://tiles.openfreemap.org/styles/liberty' }}
          ESRI_API_KEY: ${{ secrets.ESRI_API_KEY || secrets.NEXT_PUBLIC_ESRI_API_KEY }}
          NEXT_PUBLIC_ESRI_API_KEY: ${{ secrets.NEXT_PUBLIC_ESRI_API_KEY || secrets.ESRI_API_KEY }}
        run: >-
          docker build
          --build-arg NEXT_PUBLIC_MAP_STYLE_URL="$NEXT_PUBLIC_MAP_STYLE_URL"
          --build-arg ESRI_API_KEY="$ESRI_API_KEY"
          --build-arg NEXT_PUBLIC_ESRI_API_KEY="$NEXT_PUBLIC_ESRI_API_KEY"
          --tag rwanda-land-intelligence:test .
