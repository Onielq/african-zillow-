name: Live map browser smoke

on:
  # Run the real browser test for the current test branch, without requiring Vercel preview login.
  push:
    branches: [comb-test]

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out the exact test commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install application dependencies
        run: npm install --no-audit --no-fund

      - name: Install Playwright for this run
        run: npm install --no-save --no-audit --no-fund playwright

      - name: Install Chromium
        run: npx playwright install chromium

      - name: Build production app with Esri preview configuration
        env:
          ESRI_API_KEY: ${{ secrets.ESRI_API_KEY || secrets.NEXT_PUBLIC_ESRI_API_KEY }}
          NEXT_PUBLIC_ESRI_API_KEY: ${{ secrets.NEXT_PUBLIC_ESRI_API_KEY || secrets.ESRI_API_KEY }}
        run: npm run build

      - name: Start production build
        run: |
          npm run start -- --hostname 127.0.0.1 > /tmp/rli-map-smoke.log 2>&1 &
          for attempt in $(seq 1 45); do
            if curl --silent --fail http://127.0.0.1:3000/ > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/rli-map-smoke.log
          exit 1

      - name: Verify live parcel outlines at village zoom
        env:
          APP_BASE_URL: http://127.0.0.1:3000
        run: node scripts/e2e-map-parcels.mjs

      - name: Upload village-level map screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: village-parcel-boundaries
          path: artifacts/village-parcel-boundaries.png
          if-no-files-found: warn
          retention-days: 7
